[service]
workers = 2

[tts]
requests_per_minute = 2

[nats]
url = "nats://192.168.122.102:4222"
dlq_subject = "tts.dlq"

[nats.consumer]
stream = "TEXTS"
subject = "texts.processed"
durable = "tts-service-durable"

[nats.producer]
stream = "TTS"
subject = "tts.result"

[nats.object_store]
text_bucket = "TEXT_FILES"
tts_bucket = "TTS_FILES"

[nats.kv]
progress_bucket = "TTS_PROGRESS"
